port 26379
dir /tmp
loglevel debug
# Monitor the primary - quorum of 2 out of 3 sentinels
sentinel monitor mymaster valkey-0.valkey-headless.${NAMESPACE}.svc.cluster.local 6379 2

# Timing
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1

# Sentinel will rewrite this file on failover to track the new primary.
# The init script copies it to a writable location (/tmp) at startup.
sentinel announce-hostnames yes
sentinel resolve-hostnames yes
sentinel announce-port 26379
