apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: valkey-sentinel-config
    namespace: ${NAMESPACE}
    options:
      labels:
        app.kubernetes.io/component: sentinel
        app.kubernetes.io/name: valkey
    files:
      - sentinel-init.sh
      - sentinel.conf
