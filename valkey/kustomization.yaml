apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: valkey-scripts
    namespace: ${NAMESPACE}
    options:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/component: node
    files:
      - valkey-init.sh
