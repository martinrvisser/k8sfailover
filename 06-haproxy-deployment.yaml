apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy
        app.kubernetes.io/component: proxy
    spec:
      containers:
        # --- HAProxy ---
        - name: haproxy
          image: haproxy:2.9-alpine
          # Optional: credentials for the ROLE health check. Ignored unless
          # the valkey-auth Secret exists (see README, "Authentication").
          env:
            - name: VALKEY_USERNAME
              valueFrom:
                secretKeyRef: {name: valkey-auth, key: username, optional: true}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: valkey-auth, key: password, optional: true}
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
            - name: stats
              containerPort: 8404
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /stats
              port: stats
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /stats
              port: stats
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
            # Shared socket directory with failover-manager
            - name: haproxy-socket
              mountPath: /var/run/haproxy

        # --- Failover manager sidecar ---
        - name: failover-manager
          image: 10.30.52.67:32000/failover-manager:latest
          command:
            - python
            - -u
            - /scripts/failover-manager.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SENTINEL_HOST
              value: "valkey-sentinel.${NAMESPACE}.svc.cluster.local"
            - name: SENTINEL_PORT
              value: "26379"
            - name: MASTER_NAME
              value: "mymaster"
            - name: HAPROXY_SOCK
              value: "/var/run/haproxy/haproxy.sock"
            - name: HAPROXY_BACKEND
              value: "valkey_primary"
            # Optional Sentinel credentials (issue #3). Ignored unless the
            # valkey-sentinel-auth Secret exists.
            - name: SENTINEL_USERNAME
              valueFrom:
                secretKeyRef: {name: valkey-sentinel-auth, key: username, optional: true}
            - name: SENTINEL_PASSWORD
              valueFrom:
                secretKeyRef: {name: valkey-sentinel-auth, key: password, optional: true}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: failover-manager-script
              mountPath: /scripts
              readOnly: true
            # Shared socket directory with haproxy
            - name: haproxy-socket
              mountPath: /var/run/haproxy

      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
        - name: failover-manager-script
          configMap:
            name: failover-manager-script
            defaultMode: 0755
        # emptyDir shared between haproxy and failover-manager for the socket
        - name: haproxy-socket
          emptyDir: {}
