port 26379
dir /tmp

# Monitor the primary - quorum of 2 out of 3 sentinels
sentinel monitor my-primary valkey-0.valkey-headless.${NAMESPACE}.svc.cluster.local 6379 2

# Timing
sentinel down-after-milliseconds my-primary 5000
sentinel failover-timeout my-primary 10000
sentinel parallel-syncs my-primary 1

# Sentinel will rewrite this file on failover to track the new primary.
# The init script copies it to a writable location (/tmp) at startup.
sentinel announce-hostnames yes
sentinel resolve-hostnames yes
