apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: haproxy-config
    namespace: ${NAMESPACE}
    options:
      labels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/name: haproxy
    files:
      - haproxy.cfg
  - name: failover-manager-script
    namespace: ${NAMESPACE}
    options:
      labels:
        app.kubernetes.io/name: haproxy
        app.kubernetes.io/component: failover-manager
    files:
      - failover-manager.py
