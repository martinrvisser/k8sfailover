# Headless service - stable DNS for each pod
# valkey-0.valkey-headless, valkey-1.valkey-headless, valkey-2.valkey-headless
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: valkey
spec:
  clusterIP: None
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
    - name: sentinel
      port: 26379
      targetPort: sentinel
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: node

---
# Sentinel service - stable endpoint for failover manager to connect to
# Routes to all 3 sentinel sidecars; any one can respond to pub/sub
apiVersion: v1
kind: Service
metadata:
  name: valkey-sentinel
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: sentinel
spec:
  type: ClusterIP
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
      protocol: TCP
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: node

---
# Read service - load balances across all pods (primary + replicas)
# Use for read-only workloads
apiVersion: v1
kind: Service
metadata:
  name: valkey-read
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: read
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
      protocol: TCP
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/component: node
